<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/login.css">
        <link rel="icon" href="assets/bombilla.png" type="image/x-icon">
        <title>Inicio de sesion</title>
    </head>
        <body>
            <div class="contenedorLogin">
                <form class="cajaLogin" action="php/login.php" method="post">
                    <img src="assets/bombilla.png" alt="" class="bombilla">
                    <label for="usuario">Ingrese su usuario</label>
                    <input type="email" id="usuario" name="user" class="usuario" placeholder="usuario123@gmail.com" required>
                    <label for="contrasenia">Ingrese su contraseña</label>
                    <input type="password" id="contrasenia" name="pass" class="contrasenia" placeholder="minimo 8 caracteres" minlength="8" required>
                    <button type="submit">Continuar</button>
                    <a href="registro.html">Registrarse</a>
                </form>
            </div>
        </body>
        <script src="js/login.js"></script>
</html>
