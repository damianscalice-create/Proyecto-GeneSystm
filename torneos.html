<!DOCTYPE html>

<body>

    <button type="button" id="botonAbrir">
            <img src="assets/bombilla.png" alt="" srcset="">

    <aside id="miSidebar" class="sidebar">
        <button id="botonCerrar" class="close-btn" aria-label="Cerrar sidebar" title="Cerrar">&times;</button>
            
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="sobreNosotros.html">Sobre nosotros</a></li>
            <li><a href="torneos.html">Torneos</a></li>
        </ul>
    </aside>

    <div class="Borde_lol1">
        <h2>Elije un deporte</h2>
        <div class="Borde_lol2">
            <p><label for=""><input type="text" name="nombreEvento" placeholder="Nombre del evento" class="evento"></label></p>
            <select name="select" id="Juegos">
                <option value="value1" selected>Futbol</option>
                <option value="value2">Futbol Sala</option>
                <option value="value3">Tennis</option>
                <option value="value4">E-sports</option>
                <option value="value5">Ajedrez</option>
            </select>
            <select name="select" id="Concursantes">
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="6">6</option>
                <option value="8">8</option>
                <option value="12">12</option>
                <option value="16">16</option>
                <option value="18">18</option>
                <option value="20">20</option>
                <option value="24">24</option>
            </select>
        </div>

        <button type="button" id="confirmarTorneo" class="btn-confirmar">Confirmar selección</button>

        <div id="resultadoTorneo" class="resultado-torneo" aria-live="polite">
            <div class="resultado-icon">🏆</div>
            <p id="resultadoTexto">Selecciona un deporte y la cantidad de participantes para ver la fecha y la hora.</p>
        </div>

        <div id="mensajeConfirmacion" class="mensaje-confirmacion" aria-live="polite"></div>
    </div>

    <script src="js/script.js"></script>
