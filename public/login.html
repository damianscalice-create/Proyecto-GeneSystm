<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/login.css">
        <link rel="icon" href="assets/bombilla.png" type="image/x-icon">
        <link rel="preconnect" href="https://fonts.googleapis.com">     <!-- La API de la fuente de letra de Jost -->
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>    <!-- La API de la fuente de letra de Jost -->
        <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">  <!-- La API de la fuente de letra de Jost -->
        <title>Inicio de sesion</title>
    </head>
        <body>
            <div class="contenedorLogin">
                <form class="cajaLogin" id="formularioLogin">
                    <img src="assets/bombilla.png" alt="" class="bombilla">

                    <label for="usuario">Ingrese su usuario</label>
                    <input type="text" id="usuario" name="nombreUsuario" class="usuario" placeholder="Nombre de usuario" required>
                    
                    <label for="contrasenia">Ingrese su contraseña</label>
                    <input type="password" id="contrasenia" name="password" class="contrasenia" placeholder="mínimo 8 caracteres" minlength="8" required>
                    <div id="mensajeLogin" class="mensaje-confirmacion" aria-live="polite"></div>
                    
                    <button type="submit">Iniciar sesion</button>
                    
                    <a href="registro.html">Registrarse</a>
                </form>
            </div>
        </body>
        <script src="js/login.js"></script>
</html>
