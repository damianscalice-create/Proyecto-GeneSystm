<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/registro.css">
    <link rel="icon" href="assets/bombilla.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">     <!-- La API de la fuente de letra de Jost -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>    <!-- La API de la fuente de letra de Jost -->
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">  <!-- La API de la fuente de letra de Jost -->
    <title>Crear cuenta</title>
</head>
<body>
    <div class="contenedorLogin">
        <form class="cajaLogin" id="formularioRegistro" novalidate>
            <img src="assets/bombilla.png" alt="Logo de GeneSystm" class="bombilla">

            <label for="nombreUsuario">Ingrese su usuario</label>
            <input type="text" id="nombreUsuario" name="nombreUsuario" class="evento" placeholder="Nombre de usuario" required>

            <label for="email">Ingrese su email</label>
            <input type="email" id="email" name="email" class="evento" placeholder="Email" required>

            <label for="password">Ingrese su contraseña</label>
            <input type="password" id="password" name="password" class="evento" placeholder="Mínimo 8 caracteres" minlength="8" required>

            <label for="password2">Confirme su contraseña</label>
            <input type="password" id="password2" name="password2" class="evento" placeholder="Confirmar contraseña" minlength="8" required>

            <div id="mensajeRegistro" class="mensaje-confirmacion" aria-live="polite"></div>

            <button type="submit" id="botonRegistro">Crear cuenta</button>

            <a href="login.html">¿Ya tenés cuenta? Iniciá sesión</a>
        </form>
    </div>

    <script src="js/registro.js"></script>
</body>
</html>
